<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청춘새결 장비 관리자</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script></head><body>
<div id="adminLogin" class="modal"><div class="modal-card"><div class="modal-head"><span class="pill dark">ADMIN ONLY</span><h2 id="loginTitle">관리자 인증</h2><p id="loginDesc">관리자 비밀번호를 입력하세요.</p></div><form id="loginForm" class="form-grid"><label class="full">관리자 비밀번호<input id="adminPin" type="password" required placeholder="비밀번호 입력"></label><div class="full form-actions"><button class="btn primary" type="submit">관리자 페이지 열기</button></div></form></div></div>
<div id="adminApp" class="hidden"><header class="topbar"><div><div class="eyebrow">CHEONGCHUN SAE-GYEOL · ADMIN</div><h1>장비 관리자</h1></div><nav class="tabs"><button class="tab active" data-view="adminView">대시보드</button><button class="tab" data-view="scheduleView">전체 일정</button><button id="logoutAdmin" class="btn ghost">로그아웃</button></nav></header><main class="container">
<section id="adminView" class="view active"><div class="admin-hero"><div><span class="pill dark">ADMIN</span><h2>관리자 대시보드</h2><p>신청 승인·반려, 출고·반납, 장비 등록을 관리합니다.</p></div><button id="openAddModal" class="btn primary">+ 장비 추가</button></div><div class="stats" id="stats"></div><div class="admin-grid"><section class="panel"><div class="panel-head"><h3>대여 신청</h3><select id="requestFilter"><option value="all">전체</option><option value="pending">승인 대기</option><option value="approved">승인 완료</option><option value="rented">대여 중</option><option value="overdue">반납 지연</option><option value="returned">반납 완료</option><option value="rejected">반려</option></select></div><div id="adminRequests"></div></section><section class="panel"><div class="panel-head"><h3>장비 목록</h3><span id="equipmentCount" class="muted"></span></div><div id="adminEquipment"></div></section></div></section>
<section id="scheduleView" class="view"><div class="section-head"><div><span class="pill">SCHEDULE</span><h2>전체 장비 일정</h2><p>신청자와 대여 장비를 포함한 전체 일정을 확인합니다.</p></div><div class="calendar-nav"><button id="prevMonth" class="btn ghost">←</button><strong id="calendarTitle"></strong><button id="nextMonth" class="btn ghost">→</button><button id="todayMonth" class="btn ghost">오늘</button></div></div><div id="calendar" class="calendar"></div><div id="daySchedule" class="list-card calendar-detail"></div></section></main>
<div id="equipmentModal" class="modal hidden"><div class="modal-card"><button class="modal-close" data-close="equipmentModal">×</button><div class="modal-head"><span class="pill dark">EQUIPMENT</span><h3 id="equipmentModalTitle">장비 추가</h3></div><form id="equipmentForm" class="form-grid"><input id="equipmentId" type="hidden"><label>장비명<input id="equipmentName" required></label><label>관리번호<input id="equipmentCode" required></label><label>제조사 일련번호<input id="equipmentSerial"></label><label>카테고리<input id="equipmentCategory" required></label><label>수량<input id="equipmentQty" type="number" min="1" value="1" required></label><label>사용상태<input id="equipmentStatus" value="보관중"></label><label>구매일자<input id="equipmentPurchaseDate"></label><label>구매가격<input id="equipmentPrice"></label><label>책임자<input id="equipmentManager"></label><label>소유자<input id="equipmentOwner"></label><label class="full">구성품<textarea id="equipmentComponents" rows="2"></textarea></label><label class="full">기타 / 비고<textarea id="equipmentDesc" rows="2"></textarea></label><div class="full form-actions"><button type="button" class="btn ghost" data-close="equipmentModal">취소</button><button type="submit" class="btn primary">저장</button></div></form></div></div><div id="toast" class="toast"></div><script src="admin.js"></script></div></body></html>
